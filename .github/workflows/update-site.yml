name: Update site from podcast feed

on:
     on:
     push:
       paths:
         - "data/**"
     schedule:
    - cron: "17 * * * *"        # every 6 hours
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  repository_dispatch:             # lets your Flask app trigger an instant update
    types: [new-episode]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow

      - name: Read RSS + YouTube and rebuild episode sections
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_site.py

      - name: Publish changes (Cloudflare redeploys automatically)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "fhc-site-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Auto-update: episodes from podcast feed"
            git push
          else
            echo "Nothing new — site unchanged."
          fi
