name: Style guest photos

on:
  push:
    paths:
      - "photos/**"
      - "site/logos/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-isnet-v1

      - name: Install tools
        run: pip install pillow numpy "rembg[cpu]"

      - name: Style new photos
        run: python scripts/style_photos.py

      - name: Refresh the site
        run: python scripts/update_site.py

      - name: Publish changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "fhc-site-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Styled guest photo(s)"
            git push
          else
            echo "No new photos."
          fi
