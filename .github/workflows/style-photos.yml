name: Style guest photos

on:
  push:
    paths:
      - "photos/**"
      - "site/logos/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache background-removal model
        uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.rembg
          key: rembg-isnet-v1

      - name: Install tools
        run: pip install pillow numpy scipy "rembg[cpu]"

      - name: Style new photos
        run: python scripts/style_photos.py

      - name: Refresh the site
        run: python scripts/update_site.py

      - name: Publish changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "No new photos."; exit 0; fi
          git config user.name  "fhc-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Styled guest photo(s)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            echo "Push clashed with another update, retrying ($i)..."; sleep $((i * 5))
          done
          exit 1
